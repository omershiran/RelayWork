limit_req_zone $binary_remote_addr zone=agentrelai_public:10m rate=20r/s;

server {
    listen 443 ssl;
    server_name agentrelai.com;
    ssl_certificate /etc/letsencrypt/live/agentrelai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentrelai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/agentrelai-prod;
    client_max_body_size 128k;
    limit_req zone=agentrelai_public burst=40 nodelay;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=86400" always;

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8092;
    }

    location /mcp {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8092;
    }

    location /downloads/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
